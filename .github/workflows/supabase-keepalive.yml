name: Supabase Keep-Alive

on:
  schedule:
    # Ogni 4 giorni alle 08:00 UTC (evita la pausa da 7 giorni)
    - cron: '0 8 */4 * *'
  workflow_dispatch: # Permette avvio manuale dalla dashboard GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          echo "🏓 Pinging Supabase to prevent project pause..."
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/disponibilita_piatti?select=id_piatto&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "📡 HTTP Status: $RESPONSE"
          
          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "206" ]; then
            echo "✅ Supabase is awake and responding!"
          else
            echo "⚠️ Unexpected response: $RESPONSE"
            exit 1
          fi
